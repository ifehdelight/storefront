<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0 auto;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
        }

        header {
            background-color: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            padding: 10px;
        }

        header .left-section {
            display: flex;
            gap: 1rem;
            margin-left: 5px;
        }

        header .left-section .logo {
            color: rgb(236, 175, 60);
            font-size: 25px;
            font-weight: bold;
        }

        header .left-section .mobile-logo {
            color: rgb(236, 175, 60);
            font-size: 25px;
            font-weight: bold;
            display: none;
        }

        .middle-section {
            
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="left-section">
                <div class="logo">StoreFront</div>
                <div class="mobile-logo">SF</div>
            </div>

            <div class="middle-section">
                <input type="search" name="search" id="search">
                <button>
                    <img src="images/icons/search-icon.png" alt="search-icon">
                </button>
            </div>

            <div class="right-section">
                <span class="whilist">
                    <img src="images/icons/checkmark.png" alt="whilist-icon">
                </span>
                <span class="cart-button">
                    <img src="images/icons/cart-icon.png" alt="">
                </span>
            </div>
        </header>
    </div>
</body>
</html>
