<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoreFront - Home</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .products {
            padding: 15px;
            margin-top: 60px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(1fr);
            place-items: center;
        }

        .product {
            display: flex;
            flex-direction: column;
            gap: 5px;
            place-items: center;
            width: 350px;
            padding: 40px 25px 25px 25px;
            border: 1px solid rgb(131, 131, 131);
        }
        
        .product-image-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 180px;
        }

        .product img {
            max-height: 100%;
            max-width: 100%;
        }

        .product .description {
            display: flex;
            flex-direction: row;
            gap: 30px;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1.2px;
        }

        .actions {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            width: 250px;
        }

        .actions button {
            background-color: rgb(236, 175, 60);
            padding: 15px 24px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            border-radius: 13px;
        }

        @media (min-width: 600px) {
            .product-grid {
                display: grid;
                grid-template-columns: repeat(250px, 250px);
                place-items: center;
                /* width: 500px; */
            }

            /* .product {
                width: 300px;
            } */
        }
        
    </style>
</head>

                <div class="mobile-logo">SF</div>
            </div>

                    <button>

                    </button>
                </form>
            </div>

            <div class="right-section">

                <span class="cart-button">
