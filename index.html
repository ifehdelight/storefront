<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoreFront - Home</title>
    <link rel="stylesheet" href="style.css">
    <style>
       
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="left-section">
                <div class="logo">StoreFront</div>
                <div class="mobile-logo">SF</div>
            </div>

            <div class="middle-section">
                <form action="">
                    <input type="search" name="search" id="search" placeholder="Search for products...">
                    <button>
                        <img src="images/icons/search-icon.png" alt="search-icon" width="20">
                    </button>
                </form>
            </div>

            <div class="right-section">
                <span class="whilist">
                    <img src="images/icons/checkmark.png" alt="whilist-icon" width="30">
                </span>
                <span class="cart-button">
                    <img src="images/icons/cart-icon.png" alt="cart-icon" width="35">
                    <span class="cart-quantity">0</span>
                </span>
            </div>
        </header>
    </div>
</body>
</html>
